# Checks every change to the catalog, and keeps catalog/index.json current.
name: Catalog

on:
  pull_request:
    paths: ['catalog/**', 'shared/**', 'scripts/catalog.mjs']
  push:
    branches: [main]
    paths: ['catalog/**', 'shared/**', 'scripts/catalog.mjs']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Rebuild the index first so hand-edited pull requests don't need to.
      - run: node scripts/catalog.mjs index
      - run: node scripts/catalog.mjs validate
      - name: Commit the rebuilt index
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- catalog/index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/index.json
          git commit -m "Rebuild catalog index"
          git push
